[project]
name = "tradepilot"
version = "0.1.0"
description = "Conversational AI trading assistant powered by Alpaca"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-openai>=0.2",
    "langfuse>=2.0,<3.0",
    "litellm>=1.50",
    "alpaca-py>=0.30",
    "pytz>=2024.1",  # alpaca-py 0.43 imports pytz but does not declare it
    "asyncpg>=0.30",
    "redis[hiredis]>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "sse-starlette>=2.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "pytest-bdd>=7.3",
    "respx>=0.21",
    "ruff>=0.8",
    "streamlit>=1.30",
    "pyyaml>=6.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "eval: LLM evaluation tests (require cache or live LLM)",
    "integration: hits real external services",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
